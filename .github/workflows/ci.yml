
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: textauth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d textauth_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/textauth_test
          REDIS_HOST: localhost
        run: |
          pytest -v

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/deepanshugupta65/text-auth:latest
            ghcr.io/deepanshugupta65/text-auth:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: textauth-backend-production
      cancel-in-progress: false

    steps:
      - name: Configure verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 "$EC2_HOST" 2>/dev/null > ~/.ssh/known_hosts

          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          EXPECTED="SHA256:8WchcwloN5dewrXZgc7aoXKoN93Oe+XB6A95/1/R3VQ"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "EC2 host fingerprint mismatch"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend with automatic rollback
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 "ubuntu@$EC2_HOST" \
            "bash -s -- '$IMAGE_TAG' '$RUN_ID'" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu

          NEW_TAG="$1"
          RUN_ID="$2"
          IMAGE="ghcr.io/deepanshugupta65/text-auth"
          COMPOSE="docker-compose.prod.yml"

          # Remember the previous running image
          PREVIOUS_IMAGE=$(docker inspect \
            --format '{{.Image}}' textauth-api)

          ROLLBACK_TAG="rollback-${RUN_ID}"
          docker tag "$PREVIOUS_IMAGE" "$IMAGE:$ROLLBACK_TAG"

          echo "Previous image saved: $ROLLBACK_TAG"
          echo "Deploying version: $NEW_TAG"

          DEPLOY_OK=true

          if ! IMAGE_TAG="$NEW_TAG" docker compose -f "$COMPOSE" pull api; then
            DEPLOY_OK=false
          fi

          if [ "$DEPLOY_OK" = true ]; then
            if ! IMAGE_TAG="$NEW_TAG" docker compose -f "$COMPOSE" up -d --no-deps api; then
              DEPLOY_OK=false
            fi
          fi

          HEALTHY=false

          if [ "$DEPLOY_OK" = true ]; then
            for i in $(seq 1 12); do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:8000/docs > /dev/null; then
                HEALTHY=true
                break
              fi

              sleep 5
            done
          fi

          if [ "$HEALTHY" = true ]; then
            echo "Backend deployment successful: $NEW_TAG"
            exit 0
          fi

          echo "Deployment failed. Starting rollback..."

          IMAGE_TAG="$ROLLBACK_TAG" docker compose \
            -f "$COMPOSE" up -d --no-deps --force-recreate api

          curl -fsS --retry 12 --retry-delay 5 \
            --retry-connrefused \
            http://127.0.0.1:8000/docs > /dev/null

          echo "Rollback completed successfully."
          exit 1
          REMOTE
