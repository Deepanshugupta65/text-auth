
name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://textauth-demo.duckdns.org

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" > ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts | grep -F \
            "SHA256:8WchcwloN5dewrXZgc7aoXKoN93Oe+XB6A95/1/R3VQ"

      - name: Upload React build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/ubuntu/frontend-deploy"

          scp -i ~/.ssh/id_ed25519 -r frontend/dist/. \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/frontend-deploy/"

      - name: Publish frontend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" \
            "cp -a /home/ubuntu/frontend-deploy/. /var/www/textauth/ && chmod -R a+rX /var/www/textauth"
