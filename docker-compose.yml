services:
  postgres:
    image: postgres:16
    container_name: textauth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: textauth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: textauth-redis
    ports:
      - "6379:6379"

  fastapi:
    build: .
    container_name: textauth-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/textauth
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: